<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Court bookings: calls</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#17201c;--mu:#66736c;--ln:#dde3df;--ok:#17724a;--bad:#b3261e;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--card:#1a211d;--tx:#e8eeea;--mu:#9aa8a0;--ln:#2b352f;--ok:#4cc38a;--bad:#ff8a80;--warn:#e3b341}}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;max-width:720px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:24px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
input,select,button{font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx)}
button{cursor:pointer}input{width:100%;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:12px}
.card b{display:block;font-size:30px;line-height:1.1}.card span{color:var(--mu);font-size:13px}
.ok b{color:var(--ok)}.bad b{color:var(--bad)}.warn b{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
li small{color:var(--mu)}.st{font-weight:600}
.answered,.outgoing{color:var(--ok)}.missed,.rejected{color:var(--bad)}
#err{color:var(--bad);min-height:1.4em}[hidden]{display:none}
</style></head><body>
<section id="login" hidden>
<h1>Call dashboard</h1><p>Log in to see the call report.</p>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button id="go">Log in</button><p id="err"></p>
</section>
<section id="app" hidden>
<div class="bar"><h1>Calls</h1>
<span><select id="range"><option value="1">Today</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
<button id="out">Log out</button></span></div>
<div class="grid" id="cards"></div>
<h2>Check-ins</h2><p id="last"></p><ul id="chk"></ul>
<h2>Missed or rejected, not called back</h2><ul id="pend"></ul>
<h2>Latest calls</h2><ul id="list"></ul>
</section>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Paste your Firebase web app config here
const cfg={apiKey:"AIzaSyDRBf7UwhlTFAqLnvsgk4scS0mbKiHmXig",authDomain:"court-calls.firebaseapp.com",projectId:"court-calls",appId:"1:115117771252:web:02596ba333c1878d85d1a1"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=n=>(n||"").replace(/\D/g,"").slice(-9)||n;
const fmt=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const dur=s=>s>=60?Math.floor(s/60)+" min "+(s%60)+" sec":s+" sec";
const who=r=>esc(r.name||r.number||"Unknown");
$("go").onclick=async()=>{$("err").textContent="";
 try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
 catch(e){$("err").textContent="Login failed. Check email and password."}};
$("out").onclick=()=>signOut(auth);
$("range").onchange=load;
onAuthStateChanged(auth,u=>{$("login").hidden=!!u;$("app").hidden=!u;if(u)load()});
async function checkins(s){
 try{
  const l=await getDocs(query(collection(db,"checkins"),orderBy("time","desc"),limit(1)));
  const t=l.docs.length?l.docs[0].data().time:0,m=Math.round((Date.now()-t)/6e4);
  $("last").innerHTML=t?`Last check-in: <b class="${m>70?"missed":"answered"}">${fmt(t)} (${m<60?m+" min":Math.floor(m/60)+" h "+m%60+" min"} ago)</b>`:"No check-ins yet.";
  const r=(await getDocs(query(collection(db,"checkins"),where("time",">=",s),orderBy("time","desc")))).docs.map(x=>x.data());
  $("chk").innerHTML=r.map(c=>`<li><span>${fmt(c.time)}</span><small>${esc(c.email||"")}</small></li>`).join("")||"<li>No check-ins in this period.</li>";
 }catch(e){$("last").textContent="Could not load check-ins."}
}
async function load(){
 const d=new Date();d.setHours(0,0,0,0);
 const s=d.getTime()-($("range").value-1)*864e5;
 checkins(s);
 let rows;
 try{rows=(await getDocs(query(collection(db,"calls"),where("date",">=",s),orderBy("date","asc")))).docs.map(x=>x.data())}
 catch(e){$("cards").innerHTML='<p class="card">Could not load calls. This account may not have read access.</p>';return}
 const n={answered:0,missed:0,rejected:0,out:0,out0:0},pend=new Map();
 for(const r of rows){const k=key(r.number);
  if(r.status==="answered")n.answered++;
  else if(r.status==="missed")n.missed++;
  else if(r.status==="rejected")n.rejected++;
  else if(r.status==="outgoing")r.duration>0?n.out++:n.out0++;
  if(r.status==="missed"||r.status==="rejected")pend.set(k,r);
  else if(r.status==="answered"||(r.status==="outgoing"&&r.duration>0))pend.delete(k)}
 $("cards").innerHTML=
  `<div class="card ok"><b>${n.answered}</b><span>Answered</span></div>
   <div class="card bad"><b>${n.missed}</b><span>Missed</span></div>
   <div class="card warn"><b>${n.rejected}</b><span>Rejected</span></div>
   <div class="card"><b>${n.out+n.out0}</b><span>Outgoing (${n.out0} not connected)</span></div>`;
 const p=[...pend.values()].reverse();
 $("pend").innerHTML=p.length?p.map(r=>`<li><span>${who(r)}<br><small>${esc(r.number)}</small></span><span><span class="st ${r.status}">${r.status}</span><br><small>${fmt(r.date)}</small></span></li>`).join(""):"<li>Everyone has been called back.</li>";
 $("list").innerHTML=rows.slice(-100).reverse().map(r=>`<li><span>${who(r)}<br><small>${fmt(r.date)}${r.duration?" · "+dur(r.duration):""}</small></span><span class="st ${r.status}">${r.status}</span></li>`).join("")||"<li>No calls in this period.</li>";
}
</script></body></html>
